<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIRO Capital State Glyph</title>
  <style>
    :root {
      --state-color: #78f22f;
      --green: #78f22f;
      --amber: #ffbd28;
      --red: #ff241d;
      --cyan: #8eeeff;
      --ink: #f7faff;
      --muted: #d8dfeb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 42%, rgba(120, 242, 47, 0.1), transparent 27%),
        radial-gradient(circle at 53% 66%, rgba(255, 36, 29, 0.08), transparent 24%),
        linear-gradient(180deg, #010306 0%, #02050a 58%, #000102 100%);
    }

    main {
      min-height: 100svh;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: clamp(22px, 3.2vw, 36px);
      padding: clamp(24px, 4vw, 42px) clamp(16px, 4vw, 44px);
    }

    .static-title {
      margin: 0;
      color: #f4f7ff;
      font-size: clamp(30px, 4vw, 52px);
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.46);
    }

    .asset-glyph {
      width: min(620px, 100%);
      display: grid;
      justify-items: stretch;
      gap: clamp(8px, 1.4vw, 16px);
      padding: clamp(14px, 2vw, 22px);
      background:
        radial-gradient(circle at 50% 58%, rgba(120, 242, 47, 0.06), transparent 45%),
        linear-gradient(180deg, rgba(2, 7, 13, 0.56), rgba(0, 2, 5, 0.72));
    }

    .copy {
      display: grid;
      justify-items: start;
      gap: 8px;
      text-align: left;
      padding: 0 clamp(4px, 1vw, 10px);
    }

    .asset-title {
      margin: 0;
      color: var(--state-color);
      font-size: clamp(28px, 4.2vw, 38px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
      text-transform: uppercase;
      text-shadow: 0 0 24px color-mix(in srgb, var(--state-color) 46%, transparent);
      transition: color 850ms ease, text-shadow 850ms ease, opacity 260ms ease;
    }

    .asset-subtitle {
      max-width: 560px;
      min-height: 24px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(14px, 1.8vw, 18px);
      line-height: 1.35;
      font-weight: 650;
      transition: opacity 260ms ease;
    }

    .glyph {
      width: min(560px, 90vw, 58svh);
      max-width: 100%;
      justify-self: center;
      overflow: visible;
    }

    .ring-bg {
      fill: none;
      stroke: #111923;
      stroke-width: 12;
      filter: drop-shadow(0 0 8px rgba(142, 238, 255, 0.12));
    }

    .outer-ring {
      fill: none;
      stroke: var(--state-color);
      stroke-width: 12;
      stroke-linecap: round;
      transform-origin: 240px 240px;
      transform: rotate(-90deg);
      transition:
        stroke 950ms ease,
        stroke-dasharray 1100ms cubic-bezier(.2,.8,.2,1),
        filter 950ms ease;
      filter: drop-shadow(0 0 18px rgba(120, 242, 47, 0.74));
    }

    .guide {
      stroke: #344156;
      stroke-width: 1.5;
      stroke-dasharray: 6 7;
      opacity: 0.72;
    }

    .cap,
    .risk,
    .plane {
      transition: transform 1100ms cubic-bezier(.2,.8,.2,1), opacity 850ms ease;
    }

    .cap {
      transform-origin: 240px 176px;
      filter: drop-shadow(0 0 18px rgba(141, 255, 58, 0.82));
    }

    .risk {
      transform-origin: 240px 304px;
      filter: drop-shadow(0 0 16px rgba(255, 36, 29, 0.88));
    }

    .plane {
      transform-origin: 240px 240px;
    }

    .plane line {
      stroke: var(--cyan);
      stroke-width: 5.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 10px rgba(142, 238, 255, 0.95));
    }

    .plane path {
      fill: var(--cyan);
      filter: drop-shadow(0 0 10px rgba(142, 238, 255, 0.95));
    }

    .pivot {
      fill: #020407;
      stroke: rgba(255, 255, 255, 0.45);
      stroke-width: 1.4;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.2));
    }

    .pivot-ring {
      fill: none;
      stroke: var(--state-color);
      stroke-width: 1.6;
      opacity: 0.64;
      transition: stroke 950ms ease;
    }

    .center-score {
      fill: #ffffff;
      font-size: 42px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: central;
      filter: drop-shadow(0 0 9px rgba(255, 255, 255, 0.34));
      pointer-events: none;
    }

    @media (min-width: 1180px) {
      .asset-glyph {
        width: min(640px, 100%);
      }

      .glyph {
        width: min(560px, 82vw, 58svh);
      }
    }

    @media (max-width: 900px) {
      main {
        padding: clamp(24px, 5vw, 44px) clamp(16px, 4vw, 28px);
      }

      .asset-glyph {
        width: min(620px, 100%);
        gap: clamp(10px, 2.4vw, 18px);
      }

      .copy {
        gap: 8px;
      }

      .asset-title {
        font-size: clamp(28px, 5.4vw, 38px);
      }

      .asset-subtitle {
        max-width: 560px;
        font-size: clamp(14px, 2.2vw, 18px);
      }

      .glyph {
        width: min(540px, 90vw, 58svh);
      }
    }

    @media (max-width: 620px) {
      main {
        align-items: center;
        padding: 24px 14px;
      }

      .asset-glyph {
        width: min(300px, 100%);
        gap: 12px;
        padding: 8px 0;
      }

      .static-title {
        max-width: 100%;
        font-size: clamp(20px, 6vw, 24px);
        white-space: nowrap;
      }

      .copy {
        gap: 10px;
      }

      .asset-title {
        font-size: clamp(26px, 9vw, 34px);
        line-height: 1;
        text-shadow: 0 0 18px color-mix(in srgb, var(--state-color) 42%, transparent);
      }

      .asset-subtitle {
        max-width: 270px;
        min-height: 40px;
        font-size: clamp(14px, 3.8vw, 16px);
        line-height: 1.32;
      }

      .glyph {
        width: min(280px, 72vw, 52svh);
      }
    }

    @media (max-height: 760px) and (min-width: 700px) {
      .asset-glyph {
        gap: 8px;
      }

      .copy {
        gap: 10px;
      }

      .asset-title {
        font-size: clamp(26px, 4vw, 34px);
      }

      .asset-subtitle {
        font-size: clamp(17px, 1.8vw, 22px);
      }

      .glyph {
        width: min(560px, 76vw, 62svh);
      }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <defs>
      <linearGradient id="oppGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#b5ff34"></stop>
        <stop offset="55%" stop-color="#68d91f"></stop>
        <stop offset="100%" stop-color="#235e13"></stop>
      </linearGradient>
      <linearGradient id="riskGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ff5a4d"></stop>
        <stop offset="54%" stop-color="#f01913"></stop>
        <stop offset="100%" stop-color="#6e0200"></stop>
      </linearGradient>
    </defs>
  </svg>

  <main>
    <h1 class="static-title">Capital Fitness Index&trade;</h1>

    <section class="asset-glyph" id="assetGlyph" style="--state-color: #ffbd28;" aria-label="Animated capital state asset glyph">
      <div class="copy">
        <h2 class="asset-title" id="assetTitle">Asset B</h2>
        <p class="asset-subtitle" id="assetSubtitle">Balanced Opportunity and Risk, Neutral Environment</p>
      </div>

      <svg class="glyph" viewBox="0 0 480 480" role="img" aria-label="Capital state glyph">
        <circle class="ring-bg" cx="240" cy="240" r="202"></circle>
        <circle class="outer-ring" id="outerRing" cx="240" cy="240" r="202"></circle>
        <line class="guide" x1="48" y1="176" x2="432" y2="176"></line>
        <line class="guide" x1="48" y1="304" x2="432" y2="304"></line>
        <path class="cap" id="opportunityShape" d="M 96 176 A 144 112 0 0 1 384 176 L 96 176 Z" fill="url(#oppGradient)"></path>
        <path class="risk" id="riskShape" d="M 88 304 A 152 112 0 0 0 392 304 L 88 304 Z" fill="url(#riskGradient)"></path>
        <g class="plane" id="marketPlane">
          <line x1="72" y1="240" x2="408" y2="240"></line>
          <path id="planeArrow" d="M 408 240 L 388 228 L 392 240 L 388 252 Z"></path>
        </g>
        <circle class="pivot" cx="240" cy="240" r="34"></circle>
        <circle class="pivot-ring" cx="240" cy="240" r="35"></circle>
        <text class="center-score" id="centerScore" x="240" y="240">58</text>
      </svg>
    </section>
  </main>

  <script>
    const states = [
      {
        title: 'Asset A',
        subtitle: 'High Opportunity, Low Risk, Favorable Environment',
        cfi: 82,
        opportunity: 3,
        risk: 1,
        angle: -11,
        color: '#78f22f'
      },
      {
        title: 'Asset B',
        subtitle: 'Balanced Opportunity and Risk, Neutral Environment',
        cfi: 58,
        opportunity: 2,
        risk: 2,
        angle: 0,
        color: '#ffbd28'
      },
      {
        title: 'Asset C',
        subtitle: 'Limited Opportunity, High Risk, Challenging Environment',
        cfi: 27,
        opportunity: 1,
        risk: 3,
        angle: 12,
        color: '#ff241d'
      }
    ];

    const scaleByLevel = {
      opportunity: { 1: 0.49, 2: 0.76, 3: 1 },
      risk: { 1: 0.42, 2: 0.68, 3: 1 }
    };

    const ringCircumference = 2 * Math.PI * 202;
    const root = document.querySelector('#assetGlyph');
    const title = document.querySelector('#assetTitle');
    const subtitle = document.querySelector('#assetSubtitle');
    const centerScore = document.querySelector('#centerScore');
    const outerRing = document.querySelector('#outerRing');
    const opportunityShape = document.querySelector('#opportunityShape');
    const riskShape = document.querySelector('#riskShape');
    const marketPlane = document.querySelector('#marketPlane');
    const planeArrow = document.querySelector('#planeArrow');

    const initialState = 1;
    let activeState = initialState;
    let currentScore = states[initialState].cfi;

    function ringDash(score) {
      return `${Math.max(18, ringCircumference * (score / 100))} ${ringCircumference}`;
    }

    function animateScore(toValue) {
      const fromValue = currentScore;
      const start = performance.now();
      const duration = 920;

      function frame(now) {
        const progress = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        currentScore = Math.round(fromValue + (toValue - fromValue) * eased);
        centerScore.textContent = currentScore;
        if (progress < 1) requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    }

    function updateCopy(state) {
      title.style.opacity = '0';
      subtitle.style.opacity = '0';

      window.setTimeout(() => {
        title.textContent = state.title;
        subtitle.textContent = state.subtitle;
        title.style.opacity = '1';
        subtitle.style.opacity = '1';
      }, 180);
    }

    function setState(index) {
      const state = states[index];
      activeState = index;

      root.style.setProperty('--state-color', state.color);
      outerRing.style.stroke = state.color;
      outerRing.style.filter = `drop-shadow(0 0 18px ${state.color}b8)`;
      outerRing.style.strokeDasharray = ringDash(state.cfi);
      opportunityShape.style.transform = `scale(${scaleByLevel.opportunity[state.opportunity]})`;
      riskShape.style.transform = `scale(${scaleByLevel.risk[state.risk]})`;
      marketPlane.style.transform = `rotate(${state.angle}deg)`;
      planeArrow.style.opacity = state.angle === 0 ? '0' : '1';

      updateCopy(state);
      animateScore(state.cfi);
    }

    const initial = states[initialState];
    root.style.setProperty('--state-color', initial.color);
    outerRing.style.stroke = initial.color;
    outerRing.style.filter = `drop-shadow(0 0 18px ${initial.color}b8)`;
    outerRing.style.strokeDasharray = ringDash(initial.cfi);
    opportunityShape.style.transform = `scale(${scaleByLevel.opportunity[initial.opportunity]})`;
    riskShape.style.transform = `scale(${scaleByLevel.risk[initial.risk]})`;
    marketPlane.style.transform = `rotate(${initial.angle}deg)`;
    planeArrow.style.opacity = initial.angle === 0 ? '0' : '1';

    window.setInterval(() => {
      setState((activeState + 1) % states.length);
    }, 2800);
  </script>
</body>
</html>
